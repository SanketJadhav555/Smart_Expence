# ============================================
# Smart Personal Expense Tracker - LOCAL DEV
# ============================================
# Activate with: -Dspring.profiles.active=local
# or set env var: SPRING_PROFILES_ACTIVE=local

# Server
server.port=8080

# Database (H2 file-based, survives restarts)
spring.datasource.url=jdbc:h2:file:./data/expense_tracker_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Static
spring.web.resources.static-locations=classpath:/static/

# Date Format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
