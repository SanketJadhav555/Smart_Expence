# ============================================
# Smart Personal Expense Tracker - PRODUCTION
# ============================================

spring.application.name=Smart Personal Expense Tracker

# Server
server.port=8080
server.address=0.0.0.0

# Database (values come from Render ENV)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Thymeleaf (Enable caching in production for performance)
spring.thymeleaf.cache=true

# Static
spring.web.resources.static-locations=classpath:/static/

# Enable GZIP compression for faster network transfer
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Cache Control for static resources (Cache for 30 days)
spring.web.resources.cache.period=2592000